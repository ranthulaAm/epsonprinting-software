name: print_helper
description: "Print Helper - Simple, reliable, offline-first desktop printing for everyone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing (MIT / BSD-3-Clause)
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Desktop Window & Drag-and-Drop (MIT)
  window_manager: ^0.4.2
  desktop_drop: ^0.5.0
  file_picker: ^8.0.6
  cross_file: ^0.3.4+1

  # PDF, Images & Printing (MIT / Apache-2.0)
  pdfrx: ^1.0.79
  pdf: ^3.11.1
  printing: ^5.13.2
  image: ^4.2.0

  # Windows Native FFI (BSD-3-Clause)
  win32: ^5.5.4
  ffi: ^2.1.2

  # Local Persistence (MIT / BSD-3-Clause)
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI, Animations & Utilities (MIT / BSD-3-Clause)
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/profiles/
    - assets/fonts/
    - assets/icons/
    - assets/test_documents/
  fonts:
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
